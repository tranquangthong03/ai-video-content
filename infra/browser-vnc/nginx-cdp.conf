# CDP proxy: Chromium (127.0.0.1:9223) rejects non-localhost Host headers and
# advertises ws://localhost:... URLs, so rewrite both for clients in other containers.
map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 9222;

    location / {
        proxy_pass http://127.0.0.1:9223;
        proxy_http_version 1.1;
        proxy_set_header Host localhost:9223;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 1h;

        sub_filter_types application/json;
        sub_filter_once off;
        sub_filter 'ws://localhost:9223' 'ws://$http_host';
    }
}
