[project]
name = "short-video-api"
version = "0.1.0"
description = "Short Video AI API (placeholder, business logic comes later)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "celery[redis]>=5.4",
    "pydantic>=2.9",
    "watchfiles>=0.24",
    "openai>=3.37.0",
    "jinja2>=3.1.6",
    "pillow>=13.0.0",
    "playwright>=1.64.1",
    "rich>=15.0.0",
    "questionary>=2.1.1",
    "python-multipart>=0.0.32",
    "cryptography>=50.0.2",
    "opencv-python-headless>=5.0.0.93",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "pytest>=8.3",
    "httpx>=0.27",
    "pytest-xdist>=3.8.0",
    "pytest-timeout>=2.3",
    "pytest-repeat>=0.9.3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
# generated by `make codegen`, never edited by hand
extend-exclude = ["app/schemas/generated"]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"app/explorer/extract.py" = ["E501"]  # embedded JavaScript
"app/explorer/verify.py" = ["E501"]  # embedded JavaScript
"app/browser/locate.py" = ["E501"]  # embedded JavaScript
"app/recorder/inventory.py" = ["E501"]  # embedded JavaScript
"app/browser/privacy.py" = ["E501"]  # embedded JavaScript
"app/flows/page_state.py" = ["E501"]  # embedded JavaScript
"scripts/bench_flow_agent.py" = ["E501"]  # long Vietnamese report lines
"scripts/m1_report.py" = ["E501"]  # long Vietnamese report lines
"tests/**" = ["E501"]  # long fixture/data lines

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not e2e'"
timeout = 120
timeout_method = "thread"
markers = [
    "e2e: real LLM + network, run with `pytest -m e2e` (needs DEEPSEEK_API_KEY)",
    "slow: drives a real browser / ffmpeg (auto-marked); skip with -m 'not slow'",
]
pythonpath = ["."]
