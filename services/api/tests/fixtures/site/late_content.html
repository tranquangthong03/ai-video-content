<!doctype html>
<html><head><title>Late</title></head>
<body>
<div id="app"></div>
<script>
// an app that fills its page with JS a while after load (data fetched, then rendered)
setTimeout(() => {
  document.getElementById('app').innerHTML =
    '<h1>Products</h1><p>Phones, laptops and monitors with prices, photos and delivery details.</p>';
}, 1500);
</script>
</body></html>
