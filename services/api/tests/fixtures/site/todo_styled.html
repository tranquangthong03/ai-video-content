<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><title>Styled todos</title>
<style>
  li { position: relative; height: 40px; list-style: none; }
  li input.toggle { position: absolute; left: 0; top: 0; width: 40px; height: 40px; opacity: 0; }
  li label { margin-left: 50px; line-height: 40px; }
</style></head>
<body>
  <main>
    <h1>Todos</h1>
    <ul>
      <li><input class="toggle" type="checkbox"><label>Mua sữa</label></li>
      <li><input class="toggle" type="checkbox"><label>Gọi cho mẹ</label></li>
    </ul>
  </main>
</body>
</html>
