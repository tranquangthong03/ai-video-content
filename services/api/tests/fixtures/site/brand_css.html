<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <title>Brand CSS</title>
  <style>
    body { margin: 0; background: #ffffff; font-family: Arial, sans-serif; }
    header { display: flex; gap: 24px; align-items: center; padding: 12px 32px; background: #ffffff; }
    header a { color: #0EA5E9; text-decoration: none; font-size: 18px; }
    .btn-primary { background: #E11D48; color: #fff; border: 0; width: 320px; height: 84px; font-size: 24px; }
    .btn-secondary { background: #6B7280; color: #fff; border: 0; width: 160px; height: 48px; }
    .btn-ghost { background: #ffffff; color: #111; border: 1px solid #ccc; width: 160px; height: 48px; }
    .btn-dark { background: #111111; color: #fff; border: 0; width: 160px; height: 48px; }
  </style>
</head>
<body>
  <header>
    <img src="/logo.svg" alt="Acme logo" class="site-logo" width="48" height="48">
    <a href="/features.html">Tính năng</a><a href="/pricing.html">Giá</a>
  </header>
  <main>
    <h1>Tiêu đề</h1>
    <button class="btn-primary">Dùng thử</button>
    <button class="btn-secondary">Phụ</button>
    <button class="btn-ghost">Trắng</button>
    <button class="btn-dark">Đen</button>
  </main>
</body>
</html>
